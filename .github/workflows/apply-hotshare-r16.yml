name: Apply HotShare r16 source

on:
  push:
    branches: [main]
    paths:
      - ".staging/hotshare-r16/**"
      - ".github/workflows/apply-hotshare-r16.yml"

permissions:
  contents: write

jobs:
  apply-r16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact r16 source and commit
        shell: bash
        run: |
          set -euo pipefail
          cat .staging/hotshare-r16/part-*.b64 | base64 -d | xz -dc > "$RUNNER_TEMP/hotshare-r16.zip"
          python - "$RUNNER_TEMP/hotshare-r16.zip" <<'PY'
          import sys
          import zipfile

          expected = {
              "README.md",
              "android/app/src/main/java/com/hotshare/Core.kt",
              "windows/hotshare_core.py",
          }
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = set(archive.namelist())
              if names != expected:
                  raise SystemExit(f"Unexpected ZIP contents: {sorted(names)}")
              for name in sorted(expected):
                  data = archive.read(name)
                  if not data:
                      raise SystemExit(f"Empty source file: {name}")
                  print(f"Applying {name}: {len(data)} bytes")
                  with open(name, "wb") as target:
                      target.write(data)
          PY
          python -m py_compile windows/hotshare_core.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md android/app/src/main/java/com/hotshare/Core.kt windows/hotshare_core.py
          git rm -r .staging/hotshare-r16
          git rm .github/workflows/apply-hotshare-r16.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Update HotShare to r16"
          git push origin HEAD:main
